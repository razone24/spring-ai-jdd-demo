server:
  port: 8082
spring:
  lifecycle:
    timeout-per-shutdown-phase: 5s
  application:
    name: chat-history-mcp
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/jdd}
    username: ${POSTGRES_USER:jdd}
    password: ${POSTGRES_PASSWORD:jdd}
  ai:
    mcp:
      server:
        name: chat-history-mcp
        version: 1.0.0
        protocol: STATELESS
        instructions: Semantic cache of previously answered questions.
    model:
      chat: none
      embedding: ${llm.provider:openai}
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      embedding:
        metadata-mode: none
        options:
          model: ${llm.embedding-models.openai}
          dimensions: 768
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${llm.embedding-models.ollama}
      init:
        pull-model-strategy: ${OLLAMA_PULL_MODEL_STRATEGY:when_missing}
        chat:
          include: false
    vectorstore:
      pgvector:
        table-name: chat_history_${llm.provider:openai}
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        initialize-schema: true
llm:
  embedding-models:
    openai: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    ollama: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  embedding-model: ${llm.embedding-models.${llm.provider:openai}}
chat-history:
  similarity-thresholds:
    openai: 0.4
    ollama: 0.4
  similarity-threshold: ${CHAT_HISTORY_SIMILARITY_THRESHOLD:${chat-history.similarity-thresholds.${llm.provider:openai}}}
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
