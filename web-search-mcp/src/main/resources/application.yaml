server:
  port: 8083
spring:
  lifecycle:
    timeout-per-shutdown-phase: 5s
  application:
    name: web-search-mcp
  ai:
    mcp:
      server:
        name: web-search-mcp
        version: 1.0.0
        # Stateless Streamable HTTP: no server-side session, so instances can restart or scale out freely.
        protocol: STATELESS
        instructions: Public web search (Tavily) for current or general information.
tavily:
  api-key: ${TAVILY_API_KEY:}
  base-url: https://api.tavily.com
  timeout-seconds: 10
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
