global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: assistant-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["assistant-api:8090"]

  - job_name: mcp-servers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - conference-info-mcp:8080
          - rag-search-mcp:8081
          - chat-history-mcp:8082
          - web-search-mcp:8083
