name: jdd-demo

# Health check without curl/wget in the JRE image: speak HTTP over bash's /dev/tcp.
x-spring-health: &spring-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

x-ollama: &ollama-connection
  # Default: Ollama running natively on the host (uses the Mac's GPU — much faster than a container).
  # With `--profile ollama`, set OLLAMA_BASE_URL=http://ollama:11434 to use the containerised one.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}

x-postgres: &postgres-connection
  POSTGRES_URL: jdbc:postgresql://postgres:5432/jdd
  POSTGRES_USER: jdd
  POSTGRES_PASSWORD: jdd

services:

  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: jdd
      POSTGRES_USER: jdd
      POSTGRES_PASSWORD: jdd
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./observability/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jdd -d jdd"]
      interval: 5s
      timeout: 3s
      retries: 20

  conference-info-mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: conference-info-mcp/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      <<: *spring-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  rag-search-mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: rag-search-mcp/Dockerfile
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*ollama-connection, *postgres-connection]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  chat-history-mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: chat-history-mcp/Dockerfile
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*ollama-connection, *postgres-connection]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  web-search-mcp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: web-search-mcp/Dockerfile
    ports:
      - "8083:8083"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      <<: *spring-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  assistant-api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: assistant-api/Dockerfile
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: [*ollama-connection, *postgres-connection]
      SPRING_PROFILES_ACTIVE: persistence
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ASSISTANT_TODAY: ${ASSISTANT_TODAY:-}
      ASSISTANT_CACHE_HIT_THRESHOLD: ${ASSISTANT_CACHE_HIT_THRESHOLD:-0.9}
      CONFERENCE_INFO_MCP_URL: http://conference-info-mcp:8080
      RAG_SEARCH_MCP_URL: http://rag-search-mcp:8081
      CHAT_HISTORY_MCP_URL: http://chat-history-mcp:8082
      WEB_SEARCH_MCP_URL: http://web-search-mcp:8083
    depends_on:
      postgres:
        condition: service_healthy
      conference-info-mcp:
        condition: service_healthy
      rag-search-mcp:
        condition: service_healthy
      chat-history-mcp:
        condition: service_healthy
      web-search-mcp:
        condition: service_healthy
    healthcheck:
      <<: *spring-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8090 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]

  webapp:
    build: ./webapp
    ports:
      - "5173:80"
    depends_on:
      assistant-api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.5.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/jdd-assistant.json
      # Lets the web app link straight into the dashboard in kiosk mode.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres

  # Optional, fully containerised LLM: `docker compose --profile ollama up` with OLLAMA_BASE_URL=http://ollama:11434.
  # CPU-only on macOS (Docker cannot use the Apple GPU), so expect answers to be several times slower.
  # Models are pulled on first start by the Spring AI Ollama starter (pull-model-strategy: when_missing).
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.20.2
    ports:
      - "11435:11434"
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama

volumes:
  pgdata:
  ollama-models:
