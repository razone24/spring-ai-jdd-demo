server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/query -> assistant-api:8090/query (the trailing slash strips the /api prefix)
    location /api/ {
        proxy_pass http://assistant-api:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The assistant rate-limits per client; behind this proxy the client is the forwarded address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
