server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve assistant-api through Docker's DNS, so the proxy keeps working when that container is
    # recreated with a new IP (a plain proxy_pass resolves the name once, at nginx start).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $assistant_api http://assistant-api:8090;

    # /api/query -> assistant-api:8090/query
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $assistant_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The assistant rate-limits per client; behind this proxy the client is the forwarded address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
